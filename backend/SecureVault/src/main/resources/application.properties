spring.application.name=SecureVault

# ===== Base de donnees MySQL (XAMPP) =====
# Demarrer MySQL depuis le panneau de controle XAMPP avant de lancer l'application.
spring.datasource.url=jdbc:mysql://localhost:3306/securevault?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Serveur =====
server.port=8080

# ===== Securite applicative =====
# Cle de signature JWT (Base64, >= 256 bits). A remplacer par une vraie valeur secrete en production.
securevault.jwt.secret=Y2hhbmdlLW1lLXNlY3VyZXZhdWx0LXN1cGVyLXNlY3JldC1rZXktMjU2LWJpdHMtbWluaW11bQ==
securevault.jwt.expiration-ms=86400000

# Secret servant a deriver (SHA-256) la cle maitresse qui chiffre les cles privees RSA au repos.
# A remplacer par une vraie valeur secrete et a conserver hors du code en production.
securevault.master-key=securevault-master-secret-change-me

# ===== CORS (origine du frontend React/Vite) =====
securevault.cors.allowed-origins=http://localhost:5173
